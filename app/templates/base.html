<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tableau de Bord{% endblock %} - TestFlow</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/Logo_test.jpg') }}">
    <!-- CSS Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Design centralisé de la Sidebar et du Layout Dashboard -->
    <link href="{{ url_for('static', filename='css/home.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sidebar.css') }}" rel="stylesheet">
    
    <!-- CSS Spécifique à la page -->
    {% block styles %}{% endblock %}
</head>
<body>
    <div class="dashboard-container">
        <!-- INCLUSION DE LA SIDEBAR UNIFIÉE -->
        {% include 'sidebar.html' %}

        <!-- MAIN CONTENT -->
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Global App Scripts -->
    
    <!-- Scripts Spécifiques à la page -->
    {% block scripts %}{% endblock %}
</body>
</html>
