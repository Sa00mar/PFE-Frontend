<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - TestFlow</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/Logo_test.jpg') }}" sizes="32x32">
    <!-- Google Fonts - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Auth Styles -->
    <link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-wrapper">
        <!-- LEFT SIDE: Professional Visual & Slogan -->
        <div class="auth-visual-side">
            <div class="auth-slogan">
                <h2>Rejoignez notre plateforme : analysez, testez et collaborez en toute simplicité.</h2>
            </div>
        </div>

        <!-- RIGHT SIDE: Minimalist Register Form -->
        <div class="auth-form-side">
            <div class="auth-form-container" style="max-width: 500px;">
                <div class="auth-header">
                    <h1>Créer un compte</h1>
                    <p>Commencez vos tests aujourd'hui</p>
                </div>

                <div class="auth-card p-0 border-0 shadow-none">
                    <div class="auth-body p-0">
                        <!-- Message Flash (Error/Success handling) -->
                        {% if error %}
                            <div class="alert alert-danger rounded-3 fs-6 p-2 mb-4">
                                <i class="fas fa-exclamation-circle me-2"></i> {{ error }}
                            </div>
                        {% endif %}

                        <form class="auth-form" method="POST">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="firstname">Prénom</label>
                                        <input type="text" id="firstname" name="firstname" class="form-control" placeholder="Jean" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="lastname">Nom</label>
                                        <input type="text" id="lastname" name="lastname" class="form-control" placeholder="Dupont" required>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="email">Adresse email</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="nom@exemple.com" required>
                            </div>

                            <div class="form-group">
                                <label for="password">Mot de passe</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 caractères" required>
                            </div>

                            <div class="form-group mb-4">
                                <label for="confirm_password">Confirmer le mot de passe</label>
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                            </div>

                            <button type="submit" class="btn-login">
                                S'inscrire
                            </button>
                        </form>
                    </div>

                    <div class="auth-footer">
                        Vous avez déjà un compte ? 
                        <a href="{{ url_for('main.login') }}">Se connecter</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
